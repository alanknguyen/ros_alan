detection:
  hsv_ranges:
    - name: "blue"
      lower: [100, 120, 70]
      upper: [130, 255, 255]
      color_bgr: [255, 0, 0]
    - name: "red"
      lower: [0, 120, 70]
      upper: [10, 255, 255]
      lower2: [170, 120, 70]
      upper2: [180, 255, 255]
      color_bgr: [0, 0, 255]
    - name: "green"
      lower: [35, 120, 70]
      upper: [85, 255, 255]
      color_bgr: [0, 255, 0]
  min_contour_area: 500
  morph_kernel_size: 5
  gaussian_blur: 5

tracking:
  max_disappeared: 30
  max_distance: 80
  smoothing_alpha: 0.4
  trajectory_length: 60

camera:
  image_topic: "/camera/color/image_raw"
  camera_frame: "front_cam_link"
  base_frame: "base"
  intrinsics:
    fx: 554.3827128226441
    fy: 554.3827128226441
    cx: 320.5
    cy: 240.5
  fixed_z: 0.7

pickup:
  approach_height: 0.25
  grasp_height: 0.05
  lift_height: 0.15
  settle_time: 1.0
  min_stable_frames: 10
